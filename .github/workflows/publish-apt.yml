name: Publish APT repository

# Builds and signs the .deb, regenerates the signed apt/ index, and deploys it
# to GitHub Pages (the gh-pages branch) so installed users are offered the
# update through the Mint Update Manager.
#
# OPT-IN: this needs the repo-signing GPG *private* key as a secret. If you'd
# rather keep the key only on your own machine, skip this workflow and publish
# locally with:  ./publish-apt.sh --push   (see README "Publishing updates").
#
# One-time setup:
#   1. Export the private key:  gpg --armor --export-secret-keys \
#        'Linux Mint HUD repository' | xclip -selection clipboard
#   2. Repo → Settings → Secrets and variables → Actions → New secret
#        name: APT_SIGNING_KEY      value: the armored private key
#   3. (If the key has a passphrase) add a second secret APT_SIGNING_PASSPHRASE.
#   4. Settings → Actions → General → Workflow permissions → Read and write.

on:
  release:
    types: [published]
  workflow_dispatch:        # run by hand from the Actions tab

permissions:
  contents: write           # to push the gh-pages branch

concurrency:
  group: publish-apt
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'Versifft/linux-mint-hud' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y apt-utils dpkg-dev gnupg

      - name: Import signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          if [ -z "$APT_SIGNING_KEY" ]; then
            echo "::error::APT_SIGNING_KEY secret is not set — see the header of this workflow."
            exit 1
          fi
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import

      - name: Build & sign the apt repository
        env:
          GPG_PASS: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: |
          # allow non-interactive signing even when the key has a passphrase
          if [ -n "$GPG_PASS" ]; then
            export GPG_TTY=$(tty || true)
            echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf || true
            gpgconf --kill gpg-agent || true
          fi
          chmod +x ./publish-apt.sh ./build-deb.sh
          ./publish-apt.sh          # builds apt/ (no push; the deploy step handles that)

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./apt
          force_orphan: true        # keep gh-pages a single fresh commit
          cname: ""
